name: ci

# Checks on every push to main and every PR; a v* tag publishes the daemon archive and asks the box to update.
# box-service.yml is desk-infra's, copied here because a public repo cannot call a private repo's workflows.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  service:
    uses: ./.github/workflows/box-service.yml
    with:
      archive: pai-daemon
      archive-include: apps/web/build
      update-timeout: 180
    secrets:
      url: ${{ secrets.PAI_URL }}
      token: ${{ secrets.PAI_TOKEN }}
