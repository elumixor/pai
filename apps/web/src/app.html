<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>pai</title>
    <script>
      // The chosen palette before any stylesheet or module: no flash of the wrong mode.
      try {
        const choice = JSON.parse(localStorage.getItem("pai.theme") || "{}");
        const mode = choice.mode === "light" || choice.mode === "dark" ? choice.mode : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const palette = mode === "dark" ? choice.dark : choice.light;
        document.documentElement.dataset.theme = mode;
        if (palette && palette !== "pai-dark" && palette !== "nord-light") document.documentElement.dataset.palette = palette;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <!-- The desk suite's app switcher (`<desk-bar>`); the page works without it. -->
    <script type="module" src="https://desk.atmagaming.com/bar.js"></script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
